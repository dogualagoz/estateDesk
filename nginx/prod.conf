# Bu dosya conf.d/default.conf olarak mount edilir; limit_req_zone gibi
# http-context direktifleri server bloğu dışında (dosyanın başında) tanımlanır.

upstream backend_upstream {
  server backend:3001;
}

upstream frontend_upstream {
  server frontend:80;
}

# Kaba kuvvet/DoS emniyeti: IP başına 20 istek/sn (burst 40).
# Uygulama içi Throttler (100/dk) ince kontrol; bu katman ucuz ilk savunma.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;

server {
  listen 80;
  server_name _;
  client_max_body_size 90m;

  # ── Güvenlik başlıkları ──────────────────────────────────────────────
  # "always" ile hata yanıtlarında da gönderilir. NOT: nginx'te bir location
  # içinde add_header kullanılırsa server-seviyesi başlıklar o location'da
  # DEVRE DIŞI kalır — bu yüzden /uploads/ bloğunda tekrar edilirler.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  # TLS Plesk'te sonlanıyor; Plesk'in aynı başlığı eklemediği deploy'da doğrulanmalı
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  location /uploads/ {
    alias /var/www/uploads/;
    expires 30d;
    add_header Cache-Control "public, immutable";
    # location içi add_header server başlıklarını ezdiği için tekrar (yukarıdaki nota bkz.)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  }

  location /api/ {
    limit_req zone=api burst=40 nodelay;
    limit_req_status 429; # varsayılan 503 yerine anlamsal olarak doğru "Too Many Requests"
    proxy_pass http://backend_upstream/;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_read_timeout 60s;
  }

  location / {
    proxy_pass http://frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}
